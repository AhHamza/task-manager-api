<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:," />
  </head>

  <!-- Reminder Modal -->
  <div id="reminderModal" class="modal hidden">
    <div class="modal-content">
      <h3>Set Reminder</h3>
      <input type="datetime-local" id="reminderInput" />
      <div class="modal-buttons">
        <button id="saveReminder">Save</button>
        <button id="cancelReminder">Cancel</button>
      </div>
    </div>
  </div>

  <body>
    <main class="container">
      <header class="topbar">
        <h1 class="brand">Task Manager</h1>
        <div class="user-actions" id="user-actions">
          <!-- login/signup or user info will be injected -->
        </div>
      </header>

      <section id="auth-section" class="card auth-card">
        <div class="tabs">
          <button id="tab-login" class="tab active">Login</button>
          <button id="tab-signup" class="tab">Sign up</button>
        </div>

        <form id="auth-form" class="form">
          <div id="auth-fields">
            <!-- auth fields injected -->
          </div>
          <div class="form-row">
            <button id="auth-submit" class="btn primary">Submit</button>
          </div>
          <div id="auth-msg" class="small muted"></div>
        </form>
      </section>

      <section id="dashboard" class="hidden">
        <div class="controls card">
          <div class="row">
            <input id="new-desc" placeholder="New task description" />
            <button id="create-task" class="btn">Add</button>
          </div>
          <div class="row small">
            <label
              >Filter:
              <select id="filter-completed">
                <option value="all">All</option>
                <option value="true">Completed</option>
                <option value="false">Active</option>
              </select>
            </label>

            <label
              >Sort:
              <select id="sort-by">
                <option value="">--</option>
                <option value="createdAt:desc">Newest</option>
                <option value="createdAt:asc">Oldest</option>
                <option value="updatedAt:desc">Recently updated</option>
              </select>
            </label>
          </div>
        </div>

        <div id="tasks-list" class="tasks"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
